name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  lint-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint -- --max-warnings 100
        continue-on-error: true

  test-unit:
    name: Unit & Scenario Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coverage
          path: coverage/

  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          SETUP_SECRET_KEY: ${{ secrets.SETUP_SECRET_KEY }}
          MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
          NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_MIDTRANS_CLIENT_KEY }}
          MIDTRANS_MERCHANT_ID: ${{ secrets.MIDTRANS_MERCHANT_ID }}
          MIDTRANS_IS_PRODUCTION: "false"
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/

  test-integration:
    name: Integration Tests (DB + API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run integration tests
        run: npm run test:integration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CI_TEST_PREFIX: "ci_${{ github.run_id }}_"
      - name: Cleanup integration test data
        if: always()
        run: |
          PGPASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}" psql \
            "${{ secrets.SUPABASE_DB_URL }}" \
            -c "delete from public.nutrition_logs where member_id in (select m.id from public.members m join public.users u on u.id=m.user_id where u.email like 'ci_${{ github.run_id }}_%');"
          PGPASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}" psql \
            "${{ secrets.SUPABASE_DB_URL }}" \
            -c "delete from public.attendances where member_id in (select m.id from public.members m join public.users u on u.id=m.user_id where u.email like 'ci_${{ github.run_id }}_%');"
          PGPASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}" psql \
            "${{ secrets.SUPABASE_DB_URL }}" \
            -c "delete from public.payments where invoice_id in (select i.id from public.invoices i join public.members m on m.id=i.member_id join public.users u on u.id=m.user_id where u.email like 'ci_${{ github.run_id }}_%');"
          PGPASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}" psql \
            "${{ secrets.SUPABASE_DB_URL }}" \
            -c "delete from public.subscriptions where member_id in (select m.id from public.members m join public.users u on u.id=m.user_id where u.email like 'ci_${{ github.run_id }}_%');"
          PGPASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}" psql \
            "${{ secrets.SUPABASE_DB_URL }}" \
            -c "delete from public.invoices where member_id in (select m.id from public.members m join public.users u on u.id=m.user_id where u.email like 'ci_${{ github.run_id }}_%');"
          PGPASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}" psql \
            "${{ secrets.SUPABASE_DB_URL }}" \
            -c "delete from public.members where user_id in (select id from public.users where email like 'ci_${{ github.run_id }}_%');"
          PGPASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}" psql \
            "${{ secrets.SUPABASE_DB_URL }}" \
            -c "delete from public.user_roles where user_id in (select id from public.users where email like 'ci_${{ github.run_id }}_%');"
          PGPASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}" psql \
            "${{ secrets.SUPABASE_DB_URL }}" \
            -c "delete from public.users where email like 'ci_${{ github.run_id }}_%';"

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
