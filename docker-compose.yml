services:
  app:
    build: .
    env_file: .env.production
    restart: unless-stopped
    networks:
      - gym-network
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - gym-network

networks:
  gym-network:
    driver: bridge
